<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — D'Luh Festas</title>
<link rel="stylesheet" href="admin.css">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, getDocs, updateDoc, doc, where, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCV7LcTZmCE9MpezCvBah0hHQ245WYcixs",
    authDomain: "dluh-festas.firebaseapp.com",
    projectId: "dluh-festas",
    storageBucket: "dluh-festas.firebasestorage.app",
    messagingSenderId: "460615557884",
    appId: "1:460615557884:web:5162c5aba8467ddb57ed79"
  };
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window._adminGetPedidos = async () => {
    const sete = new Date(); sete.setDate(sete.getDate() - 7);
    const q = query(collection(db,'pedidos'), orderBy('criadoEm','desc'), limit(50));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({id: d.id, ...d.data()}));
  };
  window._adminUpdateStatus = (id, status) => updateDoc(doc(db,'pedidos',id), {status});
</script>
</head>
<body>

<header>
  <div>
    <div class="header-title">🎂 D'Luh Festas</div>
    <div class="header-sub">Gestão de pedidos D'Luh Festas</div>
  </div>
  <button class="btn-refresh" id="btn-refresh" onclick="carregarPedidos()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.36 2.64L21 9M21 3v6h-6M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.36-2.64L3 15M3 21v-6h6"/></svg>
    Atualizar
  </button>
</header>

<div id="tabs-wrap" style="padding:20px 24px 0">
  <div class="tabs" id="tabs-bar">
    <button class="tab-btn active" data-tab="estoque" onclick="switchTab('estoque')">📦 Estoque pendente</button>
  </div>
</div>
<div class="tab-pane active" id="tab-estoque">
<main id="main">
  <div class="loading-state" id="loading">
    <div class="spinner"></div>
    Carregando pedidos…
  </div>
</main>
</div><!-- /tab-estoque -->

<div id="status-tabs-container"></div>

<div class="toast" id="toast"></div>

<div class="confirm-overlay" id="confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-icon" id="confirm-icon">✅</div>
    <div class="confirm-title" id="confirm-title">Finalizar pedido?</div>
    <div class="confirm-msg" id="confirm-msg">Tem certeza?</div>
    <div class="confirm-actions">
      <button class="confirm-btn cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="confirm-btn ok" id="confirm-ok-btn" onclick="_confirmOk()">Sim, finalizar</button>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
