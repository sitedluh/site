<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍽️ Painel de Pedidos</title>
<meta name="theme-color" content="#f97316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="painel-pedidos.css">
<link rel="stylesheet" href="animations.css">
</head>
<body>

<div id="app">
  <!-- HEADER -->
  <header class="hdr">
    <div class="hdr-logo">🍽️ Pedidos</div>
    <div style="flex:1"></div>
    <div style="text-align:right">
      <div class="hdr-clock" id="clock">--:--</div>
      <div class="hdr-date" id="date-txt"></div>
    </div>
    <button class="btn-ic" id="sound-btn" onclick="toggleSound()">
      <div class="sdot" id="sdot"></div>
      <span id="slabel">Som</span>
    </button>
    <div style="position:relative" id="date-picker-wrap">
      <button class="btn-ic" id="date-filter-btn" onclick="toggleDatePicker()">📅 <span id="date-filter-label">Hoje</span></button>
      <div id="date-picker" style="display:none;position:absolute;right:0;top:110%;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);z-index:300;width:300px;box-shadow:0 8px 32px rgba(0,0,0,.5);overflow:hidden">
        <!-- Opções rápidas -->
        <div style="padding:8px;border-bottom:1px solid var(--border)">
          <div class="dq-opt" onclick="setDateFilter('hoje')">📅 Hoje</div>
          <div class="dq-opt" onclick="setDateFilter('amanha')">⏭️ Amanhã</div>
          <div class="dq-opt" onclick="setDateFilter('semana')">📆 Próximos 7 dias</div>
          <div class="dq-opt" onclick="setDateFilter('mes')">🗓️ Este mês</div>
          <div class="dq-opt" onclick="setDateFilter('todos')">📋 Todos os pedidos</div>
          <div class="dq-opt" onclick="setDateFilter('passados')">⏮️ Pedidos passados</div>
        </div>
        <!-- Calendário -->
        <div style="padding:10px">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <button onclick="calNav(-1)" style="background:none;border:none;color:var(--text);cursor:pointer;font-size:1.1rem;padding:4px 8px">‹</button>
            <span id="cal-title" style="font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem"></span>
            <button onclick="calNav(1)" style="background:none;border:none;color:var(--text);cursor:pointer;font-size:1.1rem;padding:4px 8px">›</button>
          </div>
          <div id="cal-grid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.78rem"></div>
        </div>
      </div>
    </div>
    <button class="btn-ic" id="tts-btn" onclick="testarVoz()" title="Testar voz">🗣️</button>
    <button class="btn-ic" onclick="printAllOrders()" title="Imprimir todos">🖨️ Tudo</button>
    <button class="btn-ic" onclick="fetchOrders()" title="Atualizar">⟳</button>
  </header>

  <button id="unlock-btn" onclick="unlockAudio()">🔊 Toque para ativar o som</button>

  <div class="main">
    <!-- QUEUE (esquerda, menor) -->
    <div class="col-queue">
      <div class="slabel">Fila do dia</div>
      <div class="filter-bar">
        <button class="fbtn active" onclick="setFilter('todos',this)">Todos</button>
        <button class="fbtn" onclick="setFilter('retirada',this)">🛍️ Retirada</button>
        <button class="fbtn" onclick="setFilter('entrega',this)">🛵 Entrega</button>
        <button class="fbtn" onclick="setFilter('urgente',this)">🔥 Urgente</button>
      </div>
      <div id="queue"></div>
      <div class="rlabel" id="rlabel">—</div>
    </div>

    <!-- FEATURED (direita, área boa da tela) -->
    <div class="col-featured">
      <div class="slabel">▶ Próximo</div>
      <div id="featured"></div>
    </div>
  </div>
</div>

<!-- ÁREA DE IMPRESSÃO (invisível na tela) -->
<div id="print-area"></div>

<!-- MOBILE VIEW -->
<div id="mobile-view">
  <div class="m-filters">
    <button class="m-pill active" onclick="setMFilter('todos',this)">Todos</button>
    <button class="m-pill" onclick="setMFilter('retirada',this)">🛍️ Retirada</button>
    <button class="m-pill" onclick="setMFilter('entrega',this)">🛵 Entrega</button>
    <button class="m-pill" onclick="setMFilter('urgente',this)">🔥 Urgente</button>
  </div>
  <div class="m-list" id="m-list"></div>
  <div class="m-rlabel" id="m-rlabel">—</div>
  <button onclick="printAllOrders()" style="position:fixed;bottom:24px;right:16px;z-index:200;background:var(--accent);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 12px rgba(249,115,22,.4);display:none" id="m-print-all-btn">🖨️</button>
</div>

<!-- MOBILE MODAL -->
<div id="m-modal-overlay" onclick="closeMModal(event)">
  <div id="m-modal">
    <div class="m-modal-handle"></div>
    <div id="m-modal-content"></div>
  </div>
</div>

<!-- CONFIRMAÇÃO DE ENTREGA / COBRANÇA -->
<div class="pp-confirm-overlay" id="entrega-confirm-overlay">
  <div class="pp-confirm-box">
    <div class="pp-confirm-icon">💳</div>
    <div class="pp-confirm-title" id="entrega-confirm-title">Marcar como entregue?</div>
    <div class="pp-confirm-msg">
      Confirmar pedido de <b id="entrega-confirm-nome"></b>?<br>
      Restante a cobrar: <b id="entrega-confirm-valor" style="color:var(--green)"></b>
    </div>
    <div class="pp-confirm-actions">
      <button class="pp-confirm-btn yes" id="entrega-confirm-yes" onclick="entregaConfirmResposta(true)">💳 Marcar e cobrar restante</button>
      <button class="pp-confirm-btn no" id="entrega-confirm-no" onclick="entregaConfirmResposta(false)">✓ Marcar sem cobrar</button>
      <button class="pp-confirm-btn cancel" onclick="closeEntregaConfirm()">Cancelar</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast-wrap">
  <div class="toast" id="toast">
    <div style="font-size:1.3rem">🔔</div>
    <div class="toast-body">
      <div class="toast-title" id="toast-title"></div>
      <div class="toast-sub" id="toast-sub"></div>
    </div>
    <button class="toast-close" onclick="hideToast()">×</button>
  </div>
</div>

<script src="painel-pedidos.js"></script>
<script src="animations.js" defer></script>
</body>
</html>
