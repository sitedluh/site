<meta property="og:title" content="D'Luh Festas — Faça seu pedido">
<meta property="og:description" content="Bolos, doces e muito mais. Faça seu pedido agora!">
<meta property="og:image" content="https://sitedluh.github.io/site/logo.png">
<meta property="og:url" content="https://sitedluh.github.io/site">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --accent:#c8703a;--accent-dark:#a85a2e;--accent-light:rgba(200,112,58,.08);
  --surface:#fff;--surface2:#f5f0eb;--border:#e8ddd4;
  --text:#1f1410;--text2:#6b5344;--text3:#9c7b6a;
  --radius:12px;--radius-sm:8px;
}
html,body{height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;background:var(--surface2)}

/* HERO */
.hero{position:relative;width:100%;height:100svh;min-height:480px;overflow:hidden;display:flex;flex-direction:column}
.hero-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(31,20,16,.72) 0%,rgba(31,20,16,.2) 55%,transparent 100%);display:flex;align-items:center;padding:0 6%}
.hero-content{color:#fff;max-width:420px}
.hero-tag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:rgba(200,112,58,.15);border:1px solid rgba(200,112,58,.3);border-radius:20px;padding:4px 12px;display:inline-block;margin-bottom:14px}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(28px,6vw,52px);font-weight:700;line-height:1.15;margin-bottom:12px}
.hero-sub{font-size:15px;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:28px}
.hero-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:background .15s;text-decoration:none}
.hero-btn:hover{background:var(--accent-dark)}
@media(max-width:600px){
  .hero-overlay{
    background:linear-gradient(180deg,rgba(31,20,16,.3) 0%,rgba(31,20,16,.85) 100%);
    align-items:flex-end;
    padding:0 5% 22%;
  }
  .hero-content{max-width:100%;text-align:center}
  .hero-tag{font-size:10px}
  .hero-title{font-size:clamp(26px,8vw,38px);margin-bottom:10px}
  .hero-sub{font-size:13px;margin-bottom:20px}
  .hero-btn{width:100%;justify-content:center;padding:14px;font-size:15px}
  .ticker-section{padding:12px 0;bottom:0}
  .ticker-item{padding:9px 14px;gap:8px;border-radius:10px}
  .ticker-item-emoji{font-size:22px}
  .ticker-item-name{font-size:13px}
  .ticker-item-price{font-size:12px}
}

/* TICKER */
.ticker-section{position:absolute;bottom:0;left:0;right:0;overflow:hidden;padding:14px 0 18px;z-index:10}
.ticker-track{display:flex;gap:20px;animation:ticker 35s linear infinite;width:max-content}
.ticker-track:hover{animation-play-state:paused}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius);padding:12px 22px;white-space:nowrap;cursor:pointer;transition:background .2s;text-decoration:none}
.ticker-item:hover{background:rgba(255,255,255,.25)}
.ticker-item-emoji{font-size:28px;line-height:1}
.ticker-item-name{font-size:15px;font-weight:600;color:#fff}
.ticker-item-price{font-size:14px;color:#f5c89a;font-weight:600}
</style>
<link rel="stylesheet" href="animations.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Bakery",
  "name": "D'Luh Festas",
  "description": "Brigadeiros, bolos personalizados, salgados artesanais e muito mais. Feitos com amor em Montes Claros.",
  "url": "https://sitedluh.github.io/site",
  "image": "https://sitedluh.github.io/site/logo.png",
  "servesCuisine": ["Confeitaria Artesanal", "Doces", "Salgados"],
  "priceRange": "$$",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Montes Claros",
    "addressRegion": "MG",
    "addressCountry": "BR"
  },
  "hasMenu": "https://sitedluh.github.io/site/cardapio.html",
  "sameAs": [
    "https://sitedluh.github.io/site",
    "https://www.instagram.com/dluhfestas/",
    "+55 (38) 9 9222-9178"
  ]
}
</script>
</head>
<body>

<div class="hero">
  <img class="hero-img" src="hero.jpg" alt="D'Luh Festas" fetchpriority="high">
  <div class="hero-overlay">
    <div class="hero-content">
      <span class="hero-tag">🎀 Encomendas especiais</span>
      <h1 class="hero-title">Doces & Salgados<br>para sua festa</h1>
      <p class="hero-sub">Brigadeiros, bolos personalizados, salgados artesanais e muito mais. Feitos com amor em Montes Claros.</p>
      <a class="hero-btn" href="cardapio.html">Ver cardápio →</a>
    </div>
  </div>
  <div class="ticker-section">
    <div class="ticker-track" id="ticker-track">
      <div class="ticker-item"><span class="ticker-item-emoji">🎂</span><span class="ticker-item-name">Carregando produtos...</span></div>
    </div>
  </div>
</div>
<script>
const WORKER_URL = 'https://coda-proxy.sitedluh.workers.dev';

const TIPO_EMOJI = {
  'Bolo':'🎂','Docinho':'🍬','Salgado':'🥐','Torta':'🥧','Bebida':'🥤'
};
async function loadTicker() {
  try {
    const res   = await fetch(WORKER_URL + '/produtos');
    const data  = await res.json();
    const items = data.produtos || [];
    if (!items.length) return;
    const track = document.getElementById('ticker-track');
    const fmt   = v => v ? ' R$ ' + Number(v).toFixed(2).replace('.',',') : '';
    const emoji = p => TIPO_EMOJI[p.tipo] || '🎂';
    const make  = p => {
      const a = document.createElement('a');
      a.className = 'ticker-item';
      a.href = 'cardapio.html';
      a.innerHTML =
        '<span class="ticker-item-emoji">' + emoji(p) + '</span>' +
        '<span class="ticker-item-name">' + p.nome + '</span>' +
        (p.valor ? '<span class="ticker-item-price">· A partir de ' + fmt(p.valor * (p.qtdMin || 1)) + '</span>' : '');
      return a;
    };
    track.innerHTML = '';
    [...items,...items].forEach(p => track.appendChild(make(p)));
    track.style.animationDuration = Math.max(25, items.length * 3.5) + 's';
  } catch(e) {}
}

loadTicker();
</script>
